repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Ruff: lint + auto-fix and formatting (covers src/, backend/, and tests/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|backend|tests)/.*\.py$
      - id: ruff-format
        files: ^(src|backend|tests)/.*\.py$

  # Pyright: fast, strict type checking (requires Node.js)
  - repo: local
    hooks:
      - id: pyright
        name: pyright type check
        entry: bash -c 'npx -y pyright'
        language: system
        files: ^(src|backend)/.*\.py$
        pass_filenames: false

  # Bandit: security checks for Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-r, --severity-level=medium]
        files: ^(src|backend)/.*\.py$

  # Optional: pip-audit (manual stage) for dependency auditing
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit dependency check
        entry: bash -c 'python -m pip_audit.cli audit --version >/dev/null 2>&1 && python -m pip_audit.cli audit || echo "Skipping pip-audit (not installed)"'
        language: system
        pass_filenames: false
        stages: [manual]

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--ignore-words-list=coba,adapteur]
        exclude: |
          (?x)^(
            node_modules|
            \.git|
            \.venv|
            dist|
            build|
            backend/uv\.lock|
            frontend/pnpm-lock\.yaml|
            frontend/\.pi|
            frontend/tsconfig\.tsbuildinfo
          )

  # Commit message validation (optional)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

# Notes:
# - Ruff covers formatting and many lint rules; avoids needing black/isort separately.
# - Pyright uses Node.js (npx -y) for fast, strict type checking via pyrightconfig.json or pyproject.toml.
# - pip-audit left as manual to avoid blocking commits when not installed.
# - Removed JS/frontend-specific hooks to keep this repo Python-focused; re-add them if frontend exists.
