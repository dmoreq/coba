repos:
  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # ── Ruff: lint + auto-fix (covers src/ and web/) ─────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
        # Explicitly pass all Python files in src/ and web/ (excludes .venv)
        files: ^(src|web)/.*\.py$
        exclude: ^web/\.venv/
      - id: ruff-format
        files: ^(src|web)/.*\.py$
        exclude: ^web/\.venv/

  # ── Black: code formatting (covers src/ and web/) ────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^(src|web)/.*\.py$
        exclude: ^web/\.venv/

  # ── Mypy: static type checking (workspace-wide) ──────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        pass_filenames: false
        # Point mypy at both the library and the web application
        args:
          - src/coba
          - web
          - --ignore-missing-imports
          - --config-file=pyproject.toml
          - --disable-error-code=no-untyped-def
          - --disable-error-code=no-untyped-call
          - --disable-error-code=annotation-unchecked
          - --disable-error-code=union-attr
        # Pass additional stub packages so mypy can resolve type info
        additional_dependencies:
          - "pydantic>=2.0"
          - "loguru>=0.7"
        files: ^(src|web)/.*\.py$
        exclude: ^web/\.venv/
