name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  core:
    name: Core Library Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/coba tests

      - name: Type check
        run: uv run mypy src/coba --ignore-missing-imports

      - name: Tests
        run: uv run pytest tests/ --ignore=tests/test_shared_sim.py -v -p no:asyncio
