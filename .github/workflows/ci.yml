name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  core:
    name: Core Library Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/coba tests

      - name: Type check
        run: mypy src/coba --ignore-missing-imports

      - name: Tests
        run: pytest tests/ --ignore=tests/test_shared_sim.py -v -p no:asyncio
