[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coba"
version = "0.1.0"
description = "High-performance, domain-agnostic contextual bandit engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Quy Doan", email = "quy.doanm@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "loguru>=0.7",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/dmoreq/coba"
Repository = "https://github.com/dmoreq/coba"
Documentation = "https://github.com/dmoreq/coba/blob/main/docs/index.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
]
streamlit = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coba = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Disable pytest-asyncio auto-collection (coba has no async code).
# Without this, pytest-asyncio raises AttributeError on Package objects.
testpaths = ["tests"]
addopts = "-p no:asyncio"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "__pycache__", ".git", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # line length handled by Black
    "I001",  # isort handled by Black's import sorting
    "N999",
]

[tool.ruff.lint.isort]
known-first-party = ["coba"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
files = ["src/coba"]
exclude = [".venv", "__pycache__", "tests"]
ignore_missing_imports = true
# Practical strictness: ignore missing stubs for third-party libs.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = false

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "loguru.*"]
ignore_missing_imports = true
ignore_errors = true
