[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "coba"
version = "0.1.0"
description = "High-performance, domain-agnostic contextual bandit engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "loguru>=0.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
streamlit = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

[tool.pytest.ini_options]
# Disable pytest-asyncio auto-collection (coba has no async code).
# Without this, pytest-asyncio raises AttributeError on Package objects.
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-p no:asyncio"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "I001"]  # line length handled by Black; isort handled by Black's import sorting

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff.lint.isort]
known-first-party = ["coba"]
